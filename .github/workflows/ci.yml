name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: newsuser
          POSTGRES_PASSWORD: newspass
          POSTGRES_DB: newsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # conftest auto-creates newsdb_test (the postgres image's user is a superuser).
      TEST_DATABASE_URL: postgresql://newsuser:newspass@localhost:5432/newsdb_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches Railway's 3.11.x runtime
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest -v

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
